# Build the Jekyll site on a modern Ruby/Jekyll stack and publish it to
# GitHub Pages.
#
# This replaces the legacy "Deploy from a branch" builder, which used
# GitHub's own pinned Jekyll 3.9.x and ignored this repository's Gemfile.
# From now on the site is built from Gemfile.lock, so CI and the local
# build produce the same output.
#
# ONE-TIME MANUAL STEP (repo admin):
#   Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions"
# Until you do that, the build job below still runs green (it is an ordinary
# CI run), but the deploy job fails with "Pages not enabled for Actions".
# You can switch back to "Deploy from a branch" at any time to roll back.
#
# After the first successful deploy, re-check:
#   - Settings -> Pages -> Custom domain  (must stay hpsaturn.com / .CNAME)
#   - "Enforce HTTPS" re-enabled (the certificate is re-provisioned)
#
# No .nojekyll is needed: with an Actions deployment the artifact is served
# as-is, so underscore/asset paths are not filtered.

name: Build and deploy Jekyll site

on:
  push:
    branches:
      - master
      # TEMP: validate this migration branch through the very same build job
      # that runs in production, without deploying anything (the deploy job
      # is gated on master). Remove this entry after the merge.
      - jekyll_update
  # NOTE: workflow_dispatch only appears in the UI / `gh workflow run` once
  # this file exists on the default branch; the push trigger covers the
  # branch period.
  workflow_dispatch:

# Least privilege: read the repository, publish to Pages, and mint the OIDC
# token that actions/deploy-pages needs. Missing id-token -> "Failed to get
# ID token"; missing environment -> the run hangs on "deployment in progress".
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two runs of the same ref deploy on top of each other.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fully exercisable offline with `act -j build`, and the only job you need
  # when you just want to know whether the site still compiles.
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Ruby is taken from .ruby-version (3.1.7); the gem set comes from the
      # committed Gemfile.lock (BUNDLED WITH 2.4.22) and is cached between
      # runs. No `ruby-version:` input needed - ruby/setup-ruby auto-detects
      # .ruby-version / .tool-versions / the Gemfile `ruby` directive.
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      # JEKYLL_ENV=production matches the old GitHub Pages behaviour. Add
      # `--strict_front_matter` later if you want malformed front matter to
      # fail the build instead of being silently ignored.
      - name: Build with Jekyll
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      # NOTE: actions/configure-pages is intentionally not used. It is only
      # needed for its outputs (base_url, ...) or to set the custom domain
      # from CI; it also fails while Pages is still on the legacy source.
      # The theme's SCSS still emits Dart Sass deprecation warnings (16 of
      # them, from lighten()/darken(), slash-division and @import). They are
      # expected on Jekyll 4.4 and do not fail the build, but Dart Sass 3.0
      # will turn them into errors.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Only the default branch publishes. Branch pushes above are build-only,
    # so the migration can be validated without touching production.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
